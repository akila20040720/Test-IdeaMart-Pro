<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IdeaPro API Test Application</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>IdeaPro API Tester</h1>

            <p>
                Test OTP Verification and SMS APIs
            </p>
        </div>


        <!-- STEP 1 -->
        <div class="card">

            <div class="step-title">
                <span>1</span>
                <div>
                    <h2>Request OTP</h2>
                    <p>Enter your Dialog mobile number</p>
                </div>
            </div>

            <label for="mobileNumber">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobileNumber"
                placeholder="947XXXXXXXX"
            >

            <button
                id="requestOtpButton"
                onclick="requestOTP()"
            >
                Send OTP
            </button>

        </div>


        <!-- STEP 2 -->
        <div class="card disabled-card" id="verifyCard">

            <div class="step-title">
                <span>2</span>
                <div>
                    <h2>Verify OTP</h2>
                    <p>Enter the OTP received on your phone</p>
                </div>
            </div>

            <label for="otp">
                OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                disabled
            >

            <button
                id="verifyOtpButton"
                onclick="verifyOTP()"
                disabled
            >
                Verify OTP
            </button>

        </div>


        <!-- STEP 3 -->
        <div class="card disabled-card" id="smsCard">

            <div class="step-title">
                <span>3</span>
                <div>
                    <h2>Send SMS</h2>
                    <p>Send a test SMS after successful verification</p>
                </div>
            </div>

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                placeholder="Type your test SMS here..."
                disabled
            ></textarea>

            <button
                id="sendSmsButton"
                onclick="sendSMS()"
                disabled
            >
                Send SMS
            </button>

        </div>


        <!-- API RESPONSE -->
        <div class="response-card">

            <div class="response-header">

                <h2>API Response</h2>

                <span id="statusBadge" class="status waiting">
                    Waiting
                </span>

            </div>

            <pre id="response">Waiting for an API request...</pre>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
